# Cấu hình Supabase chạy cục bộ (`supabase start`).
# Đây là môi trường THỬ trên máy bạn — không phải project thật trên cloud.

project_id = "homescare"

[api]
enabled = true
port = 54321
# CHỈ phơi ra schema `public`. Cố ý KHÔNG phơi `auth_helpers`: các hàm trong đó là
# ruột của hệ thống phân quyền, không có lý do gì để gọi được từ ngoài qua REST.
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 16

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
jwt_expiry = 3600
enable_refresh_token_rotation = true

# S1 (chốt 24/09/2026): đăng nhập bằng EMAIL + MẬT KHẨU.
#
# KHÔNG cho tự đăng ký. App chỉ có hai kiểu người dùng — chủ nhà và quản lý của chủ
# nhà đó — nên tài khoản do CHỦ NHÀ tạo/mời, không phải ai tải app về cũng tự lập
# được. Tự đăng ký bật thì bất kỳ ai cũng có tài khoản `authenticated`; RLS vẫn chặn
# dữ liệu, nhưng không có lý do gì để mở cửa đó.
# Môi trường thử: tạo người dùng trong Studio (localhost:54323 → Authentication → Add user).
enable_signup = false

# Mật khẩu tối thiểu 10 ký tự, có chữ và số. App đụng tiền và ảnh CCCD.
minimum_password_length = 10
password_requirements = "letters_digits"

[auth.email]
enable_signup = false
# Cục bộ không có hộp thư thật; production BẬT xác nhận và cấu hình SMTP riêng.
enable_confirmations = false
# Đổi mật khẩu phải nhập lại mật khẩu cũ / xác nhận qua email.
secure_password_change = true

# Xác thực 2 lớp bằng ứng dụng tạo mã (Google Authenticator...). BẮT BUỘC với chủ nhà
# — tài khoản này thấy toàn bộ tiền (SECURITY.md §6). Việc ép buộc nằm ở app + RLS
# (kiểm `aal2`), cấu hình ở đây chỉ bật tính năng.
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[storage]
enabled = true
# Ảnh CCCD tối đa 8MB; giới hạn theo từng bucket đặt trong 0005_storage.sql.
file_size_limit = "100MiB"

[analytics]
enabled = false

# ---------------------------------------------------------------- Edge Functions
# SePay và pg_cron không có JWT người dùng → tắt kiểm JWT, hàm TỰ xác thực bằng khoá riêng
# (SEPAY_WEBHOOK_SECRET / CRON_SECRET). Tắt kiểm JWT mà quên tự xác thực = ai cũng gọi được.
[functions.sepay-webhook]
verify_jwt = false

[functions.run-reminders]
verify_jwt = false

[functions.purge-expired-docs]
verify_jwt = false

# Chủ nhà gọi từ app → BẮT BUỘC có JWT.
[functions.invite-member]
verify_jwt = true

[functions.create-payment-request]
verify_jwt = true
